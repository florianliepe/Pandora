name: Pandora issue runner
run-name: Pandora issue ${{ inputs.event_id }}

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Exact Pandora automation event UUID
        required: true
        type: string

concurrency:
  group: pandora-issue-${{ inputs.event_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate required configuration
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEIDS_APP_GITHUB_TOKEN: ${{ secrets.MEIDS_APP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in PANDORA_BRIDGE_URL PANDORA_WORKER_TOKEN OPENAI_API_KEY MEIDS_APP_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "Missing required repository secret: $name" >&2; exit 1; fi
          done
          case "$PANDORA_BRIDGE_URL" in https://*) ;; *) echo "PANDORA_BRIDGE_URL must use HTTPS" >&2; exit 1;; esac

      - name: Claim exact event
        id: claim
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs start --event-id "${{ inputs.event_id }}" --run-id "${{ github.run_id }}"

      - name: Check out pinned application base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: florianliepe/meids-app
          ref: ${{ steps.claim.outputs.base_sha }}
          token: ${{ secrets.MEIDS_APP_GITHUB_TOKEN }}
          persist-credentials: false
          path: source

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install application and browser dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if npm exec --yes playwright -- --version >/dev/null 2>&1; then npm exec playwright install --with-deps chromium; fi

      - name: Prepare private prompt
        shell: bash
        run: node runner/prepare-prompt.mjs --event-id "${{ inputs.event_id }}" --output .runner/private/prompt.txt

      - name: Renew claim before model execution
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs renew --event-id "${{ inputs.event_id }}"

      - name: Implement bounded candidate
        timeout-minutes: 10
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: source
          permission-profile: ":workspace"
          prompt-file: ../.runner/private/prompt.txt
          output-file: ../.runner/private/codex-final.txt
          effort: high

      - name: Confirm current event and renew claim
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: |
          node runner/bridge.mjs status --event-id "${{ inputs.event_id }}"
          node runner/bridge.mjs renew --event-id "${{ inputs.event_id }}"

      - name: Verify candidate policy
        shell: bash
        run: node runner/verify-source.mjs diff --event-id "${{ inputs.event_id }}" --root source

      - name: Commit and publish isolated branch
        id: publish
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MEIDS_APP_GITHUB_TOKEN }}
          EVENT_ID: ${{ inputs.event_id }}
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          BASE_SHA: ${{ steps.claim.outputs.base_sha }}
        run: |
          set -euo pipefail
          branch="pandora/$EVENT_ID"
          git switch -c "$branch"
          git config user.name "Pandora issue runner"
          git config user.email "pandora-runner@users.noreply.github.com"
          git add --all
          git commit -m "Fix verified Pandora issue"
          head_sha="$(git rev-parse HEAD)"
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          printf '#!/bin/sh\nprintf %%s "$GH_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_USERNAME=x-access-token git push "https://x-access-token@github.com/florianliepe/meids-app.git" "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --repo florianliepe/meids-app --base main --head "$branch" --title "Verified Pandora repair" --body "Pandora-Delivery: $JOB_ID")"
          pr_number="${pr_url##*/}"
          node -e 'const fs=require("fs");fs.writeFileSync("../.runner/private/publication.json",JSON.stringify({repository:"florianliepe/meids-app",baseBranch:"main",baseSha:process.env.BASE_SHA,headSha:process.argv[1],headBranch:process.argv[2],pullNumber:Number(process.argv[3]),pullUrl:process.argv[4],marker:`Pandora-Delivery: ${process.env.JOB_ID}`}))' "$head_sha" "$branch" "$pr_number" "$pr_url"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pull_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Register sanitized publication
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs publish --event-id "${{ inputs.event_id }}" --file .runner/private/publication.json

      - name: Stop unless trusted evidence and merge callbacks are implemented
        shell: bash
        run: |
          echo "The receiver must implement publish, exact-SHA evidence, merge-readiness, and merged callbacks before automatic merge is enabled." >&2
          exit 1

      - name: Acknowledge requested cancellation
        if: ${{ cancelled() }}
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs cancelled --event-id "${{ inputs.event_id }}" --run-id "${{ github.run_id }}"

      # Deliberately unreachable until the callback/store package implements the documented
      # evidence and merge attestations. Do not replace this gate with model output or gh exit codes.
