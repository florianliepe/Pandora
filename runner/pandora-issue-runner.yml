name: Pandora issue runner
run-name: Pandora issue ${{ inputs.event_id }}

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Exact Pandora automation event UUID
        required: true
        type: string

concurrency:
  group: pandora-issue-${{ inputs.event_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVENT_ID: ${{ inputs.event_id }}
    steps:
      - name: Check out trusted runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate required configuration
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          for name in PANDORA_BRIDGE_URL PANDORA_WORKER_TOKEN OPENAI_API_KEY; do
            if [ -z "${!name:-}" ]; then echo "Missing required repository secret: $name" >&2; exit 1; fi
          done
          if [ "$PANDORA_BRIDGE_URL" != "https://eraneos-agentic-platform.azurewebsites.net/webhook/pandora-issue-runner-v1" ]; then echo "PANDORA_BRIDGE_URL is not the approved receiver" >&2; exit 1; fi

      - name: Claim exact event
        id: claim
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs start --event-id "$EVENT_ID" --run-id "$GITHUB_RUN_ID"

      - name: Check out pinned application base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: florianliepe/meids-app
          ref: ${{ steps.claim.outputs.base_sha }}
          persist-credentials: false
          path: source

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install application and browser dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Prepare private prompt
        shell: bash
        run: node runner/prepare-prompt.mjs --event-id "$EVENT_ID" --output .runner/private/prompt.txt

      - name: Renew claim before model execution
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs renew --event-id "$EVENT_ID"

      - name: Implement bounded candidate
        timeout-minutes: 10
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: source
          permission-profile: ":workspace"
          prompt-file: ../.runner/private/prompt.txt
          output-file: ../.runner/private/codex-final.txt
          effort: high

      - name: Confirm current event and renew claim
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: |
          node runner/bridge.mjs status --event-id "$EVENT_ID"
          node runner/bridge.mjs renew --event-id "$EVENT_ID"

      - name: Verify candidate policy
        shell: bash
        run: node runner/verify-source.mjs diff --event-id "$EVENT_ID" --root source

      - name: Prepare bounded source publication proposal
        shell: bash
        run: |
          set -euo pipefail
          node runner/prepare-publication.mjs --event-id "$EVENT_ID" --root source --output .runner/private/publication-proposal.json

      - name: Request constrained trusted publication
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs publish --event-id "$EVENT_ID" --file .runner/private/publication-proposal.json

      - name: Record evidence harness prerequisite
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: |
          printf '%s\n' 'Trusted issue-specific reproduction, regression, integration, and browser harness is not configured; publication remains unmerged.' > .runner/private/needs-input.txt
          node runner/bridge.mjs finish --event-id "$EVENT_ID" --outcome needs_input --summary-file .runner/private/needs-input.txt

      - name: Stop unless trusted evidence and merge callbacks are implemented
        shell: bash
        run: |
          echo "The receiver must implement publish, exact-SHA evidence, merge-readiness, and merged callbacks before automatic merge is enabled." >&2
          exit 1

      - name: Acknowledge requested cancellation
        if: ${{ cancelled() }}
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs cancelled --event-id "$EVENT_ID" --run-id "$GITHUB_RUN_ID"

      # Deliberately unreachable until the callback/store package implements the documented
      # evidence and merge attestations. Do not replace this gate with model output or gh exit codes.
