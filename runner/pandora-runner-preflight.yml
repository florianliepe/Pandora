name: Pandora runner preflight
run-name: Pandora runner preflight ${{ inputs.mode }} ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Nondestructive readiness probe
        required: true
        type: choice
        options:
          - callback
          - provider
          - cancellation
          - evidence

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runner/
            /.github/workflows/

      - name: Prepare synthetic attestation
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p .runner/private
          node -e 'const fs=require("fs"),crypto=require("crypto");fs.writeFileSync(".runner/private/preflight.json",JSON.stringify({schemaVersion:1,mode:process.env.MODE,phase:"started",nonce:crypto.randomUUID(),receiverWorkflowPath:"runner/issue-runner-receiver.workflow.json"}))'

      - name: Authenticate callback without an issue event
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: node runner/bridge.mjs preflight --event-id 00000000-0000-4000-8000-000000000001 --run-id "${{ github.run_id }}" --file .runner/private/preflight.json

      - name: Prepare isolated provider user
        if: ${{ inputs.mode == 'provider' }}
        shell: bash
        run: |
          sudo useradd --create-home --shell /bin/bash pandora-codex
          sudo install -d -o pandora-codex -g pandora-codex -m 0700 /tmp/pandora-provider

      - name: Verify provider authentication
        if: ${{ inputs.mode == 'provider' }}
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        timeout-minutes: 3
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: unprivileged-user
          codex-user: pandora-codex
          working-directory: /tmp/pandora-provider
          prompt: "Return only the word READY. Do not read repository files."
          output-file: /tmp/pandora-provider/result.txt
          effort: low

      - name: Wait for explicit cancellation
        if: ${{ inputs.mode == 'cancellation' }}
        shell: bash
        run: sleep 300

      - name: Record completed preflight
        if: ${{ success() && inputs.mode != 'cancellation' }}
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          node -e 'const fs=require("fs"),v=JSON.parse(fs.readFileSync(".runner/private/preflight.json"));v.phase="completed";fs.writeFileSync(".runner/private/preflight.json",JSON.stringify(v))'
          node runner/bridge.mjs preflight --event-id 00000000-0000-4000-8000-000000000001 --run-id "${{ github.run_id }}" --file .runner/private/preflight.json

      - name: Record observed cancellation
        if: ${{ cancelled() }}
        shell: bash
        env:
          PANDORA_BRIDGE_URL: ${{ secrets.PANDORA_BRIDGE_URL }}
          PANDORA_WORKER_TOKEN: ${{ secrets.PANDORA_WORKER_TOKEN }}
        run: |
          node -e 'const fs=require("fs"),v=JSON.parse(fs.readFileSync(".runner/private/preflight.json"));v.phase="cancelled";fs.writeFileSync(".runner/private/preflight.json",JSON.stringify(v))'
          node runner/bridge.mjs preflight --event-id 00000000-0000-4000-8000-000000000001 --run-id "${{ github.run_id }}" --file .runner/private/preflight.json
